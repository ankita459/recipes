<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Recipe Collection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ee;
            color: #333;
        }

        header {
            text-align: center;
            padding: 45px 20px;
            background: white;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            color: #777;
            font-size: 17px;
        }

        .recipes {
            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }

        .card {
            width: 350px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 25px;
            text-align: center;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .card p {
            color: #666;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: #d35400;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #a04000;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍴 My Recipe Collection</h1>
        <p>Delicious recipes made simple</p>
    </header>

    <section class="recipes">

        <div class="card">

            <img src="./aloo-paratha/aloo-paratha/_C__Users_ankit_Downloads_Recipe%20Genie-saved%20(4).html.png"
                 alt="Aloo Paratha">

            <div class="card-content">

                <h2>Aloo Paratha</h2>

                <p>
                    A delicious Indian stuffed potato
                    flatbread that's crispy and flavorful.
                </p>

                <a href="./aloo-paratha/index.html" class="button">
                    View Recipe →
                </a>

            </div>

        </div>

    </section>

</body>
</html>
