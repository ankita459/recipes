<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Recipe Collection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ee;
            color: #333;
        }

        /* Header */
        header {
            text-align: center;
            padding: 50px 20px;
            background: white;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            margin-top: 12px;
            color: #777;
            font-size: 18px;
        }

        /* Recipe Cards */
        .recipes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 350px));
            justify-content: center;
            gap: 50px;
            padding: 60px 30px;
        }

        .card {
            width: 350px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 25px;
            text-align: center;
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        .card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Button */
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #d35400;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #a04000;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            background: white;
            color: #777;
            margin-top: 30px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            header h1 {
                font-size: 30px;
            }

            .card {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🍴 My Recipe Collection</h1>
        <p>Delicious recipes made simple</p>
    </header>


    <!-- Recipes -->
    <section class="recipes">

        <!-- Aloo Paratha -->
        <div class="card">

            <img
                src="https://images.unsplash.com/photo-1626132647523-66f5bf380027?auto=format&fit=crop&w=800&q=80"
                alt="Aloo Paratha"
            >

            <div class="card-content">

                <h2>Aloo Paratha</h2>

                <p>
                    A delicious Indian stuffed potato
                    flatbread that's crispy and flavorful.
                </p>

                <a href="./aloo-paratha/" class="button">
                    View Recipe →
                </a>

            </div>

        </div>


        <!-- Masala Maggi -->
        <div class="card">

            <img
                src="https://images.unsplash.com/photo-1625398407796-82650a8c135f?auto=format&fit=crop&w=800&q=80"
                alt="Masala Maggi"
            >

            <div class="card-content">

                <h2>Masala Maggi</h2>

                <p>
                    Spicy and flavorful Indian-style
                    Masala Maggi that's quick and delicious.
                </p>

                <a href="./masala-maggi/" class="button">
                    View Recipe →
                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 My Recipe Collection</p>
    </footer>

</body>
</html>
